<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#1a1a1a"/>
  <!-- 背景テクスチャ：コーヒー豆の散りばめ -->
  <g opacity="0.06">
    <g transform="translate(200, 200) rotate(30)">
      <ellipse rx="30" ry="18" fill="#c8a97e"/>
      <path d="M0 -18 Q-6 0 0 18" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <g transform="translate(500, 600) rotate(-20)">
      <ellipse rx="25" ry="15" fill="#c8a97e"/>
      <path d="M0 -15 Q-5 0 0 15" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <g transform="translate(1400, 300) rotate(45)">
      <ellipse rx="28" ry="17" fill="#c8a97e"/>
      <path d="M0 -17 Q-6 0 0 17" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <g transform="translate(1600, 700) rotate(-10)">
      <ellipse rx="22" ry="14" fill="#c8a97e"/>
      <path d="M0 -14 Q-5 0 0 14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <g transform="translate(800, 900) rotate(60)">
      <ellipse rx="26" ry="16" fill="#c8a97e"/>
      <path d="M0 -16 Q-5 0 0 16" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <g transform="translate(1100, 150) rotate(-35)">
