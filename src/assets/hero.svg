  </g>
  <!-- 中央の装飾円 -->
  <circle cx="960" cy="540" r="300" fill="none" stroke="#c8a97e" stroke-width="0.5" opacity="0.1"/>
  <circle cx="960" cy="540" r="200" fill="none" stroke="#c8a97e" stroke-width="0.5" opacity="0.08"/>
  <!-- カップシルエット -->
  <g transform="translate(960, 480)" opacity="0.08">
    <path d="M-60 0 Q-60 80 0 80 Q60 80 60 0" fill="none" stroke="#c8a97e" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="60" ry="18" fill="none" stroke="#c8a97e" stroke-width="2"/>
    <path d="M60 15 Q85 10 82 -15 Q78 -40 55 -25" fill="none" stroke="#c8a97e" stroke-width="2"/>
  </g>
  <!-- 蒸気 -->
  <g transform="translate(960, 440)" opacity="0.06">
    <path d="M-20 0 Q-15 -30 -10 -10 Q-5 -40 0 -15 Q5 -50 10 -20" fill="none" stroke="#c8a97e" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 5 Q20 -25 25 -5 Q30 -35 35 -10" fill="none" stroke="#c8a97e" stroke-width="2" stroke-linecap="round"/>
  </g>
