<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#2a2a2a" rx="12"/>
  <!-- パッケージ袋 -->
  <path d="M180 180 L180 620 Q180 650 210 650 L390 650 Q420 650 420 620 L420 180 Q420 160 400 155 L300 130 L200 155 Q180 160 180 180Z" fill="#333333" stroke="#c8a97e" stroke-width="1.5"/>
  <path d="M200 155 Q300 145 400 155 L400 180 Q300 170 200 180Z" fill="#c8a97e" opacity="0.1"/>
  <!-- コーヒーの葉モチーフ -->
  <g transform="translate(300, 350)">
    <path d="M0 -50 Q30 -30 0 0 Q-30 -30 0 -50Z" fill="#c8a97e" opacity="0.1" stroke="#c8a97e" stroke-width="1"/>
    <path d="M0 0 Q25 15 0 45 Q-25 15 0 0Z" fill="#c8a97e" opacity="0.08" stroke="#c8a97e" stroke-width="1"/>
    <!-- 葉脈 -->
    <line x1="0" y1="-48" x2="0" y2="-5" stroke="#c8a97e" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="3" x2="0" y2="40" stroke="#c8a97e" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- コーヒー豆 -->
  <g transform="translate(260, 400) rotate(-20)">
    <ellipse rx="14" ry="9" fill="#c8a97e" opacity="0.3"/>
    <path d="M0 -9 Q-3 0 0 9" fill="none" stroke="#333333" stroke-width="1"/>
  </g>
  <g transform="translate(340, 395) rotate(15)">
    <ellipse rx="12" ry="8" fill="#c8a97e" opacity="0.25"/>
    <path d="M0 -8 Q-3 0 0 8" fill="none" stroke="#333333" stroke-width="1"/>
  </g>
  <!-- ブランド名 -->
  <text x="300" y="470" text-anchor="middle" fill="#c8a97e" font-family="serif" font-size="26" font-weight="bold" letter-spacing="0.1em">BRAZIL</text>
  <text x="300" y="500" text-anchor="middle" fill="#c8a97e" font-family="serif" font-size="16" letter-spacing="0.2em">SANTOS</text>
  <text x="300" y="550" text-anchor="middle" fill="#c8a97e" font-family="sans-serif" font-size="12" opacity="0.5">200g</text>
</svg>
