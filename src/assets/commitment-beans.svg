<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#2a2a2a" rx="100"/>
  <!-- 中央の豆 -->
  <g transform="translate(100, 90) rotate(-10)">
    <ellipse rx="28" ry="18" fill="#c8a97e" opacity="0.6"/>
    <path d="M0 -18 Q-6 0 0 18" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  </g>
  <!-- 左の豆 -->
  <g transform="translate(65, 110) rotate(-30)">
    <ellipse rx="20" ry="13" fill="#c8a97e" opacity="0.4"/>
    <path d="M0 -13 Q-4 0 0 13" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  </g>
  <!-- 右の豆 -->
  <g transform="translate(135, 105) rotate(20)">
    <ellipse rx="22" ry="14" fill="#c8a97e" opacity="0.5"/>
    <path d="M0 -14 Q-5 0 0 14" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  </g>
  <text x="100" y="160" text-anchor="middle" fill="#c8a97e" font-family="serif" font-size="13" letter-spacing="0.05em">BEANS</text>
</svg>
